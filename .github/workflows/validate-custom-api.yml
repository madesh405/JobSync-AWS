name: Validate Custom API Source Feature

on:
  push:
    branches:
      - feature/custom-api-sources
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install connector test dependencies
        run: python -m pip install requests beautifulsoup4

      - name: Compile backend Python files
        run: |
          python -m py_compile api_lambda.py custom_api_connector.py lambda_function.py job_pipeline.py sync_engine.py source_state.py

      - name: Test custom API connector
        run: python -m unittest discover -s tests -v

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Prepare Lambda deployment packages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/api dist/worker
          cp api_lambda.py dist/api/lambda_function.py
          cp lambda_function.py custom_api_connector.py job_pipeline.py sync_engine.py source_state.py dist/worker/
          python -m pip install requests beautifulsoup4 -t dist/worker --disable-pip-version-check --quiet
          (cd dist/api && zip -q -r ../JobSyncJobApi.zip .)
          (cd dist/worker && zip -q -r ../JobSyncCrawlWorker.zip .)
          echo "API package bytes: $(stat -c%s dist/JobSyncJobApi.zip)"
          echo "Worker package bytes: $(stat -c%s dist/JobSyncCrawlWorker.zip)"

      - name: Upload Lambda deployment packages
        uses: actions/upload-artifact@v4
        with:
          name: jobsync-lambda-packages
          path: |
            dist/JobSyncJobApi.zip
            dist/JobSyncCrawlWorker.zip
          if-no-files-found: error
          retention-days: 7
